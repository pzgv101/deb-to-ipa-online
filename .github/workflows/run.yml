name: Run

on:
  workflow_dispatch:
    inputs:
      deb:
        description: "Direct URL to deb file"
        required: true

jobs:
  run:
    runs-on: ubuntu-latest

    steps: # <--- Only one steps block defined here
           - name: Convert deb to IPA
        run: |
          DEB_URL="${{ github.event.inputs.deb }}"
          
          # Validate that a URL was provided
          if [ -z "$DEB_URL" ]; then
            echo "Error: No deb URL provided"
            exit 1
          fi
          
          echo "Downloading from: $DEB_URL"
          curl -L -o ${{ github.workspace }}/app.deb "$DEB_URL"
          dpkg-deb -X ${{ github.workspace }}/app.deb ${{ github.workspace }}/app

          mkdir -p ${{ github.workspace }}/ipa/Payload
          cp -R ${{ github.workspace }}/app/Applications/* ${{ github.workspace }}/ipa/Payload
          
          cd ${{ github.workspace }}/ipa
          zip -r ${{ github.workspace }}/App.ipa .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-artifact
          path: ${{ github.workspace }}/App.ipa # <--- Updated this path to match your generated file!
